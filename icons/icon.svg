<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="50%" stop-color="#292524" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="terracottaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield with Soft Rounded Border -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.35" />

  <!-- Outer Roman Wreath / Laurels (Stylized) -->
  <g fill="url(#goldGrad)" opacity="0.85">
    <!-- Left Wreath Leaf Clusters -->
    <path d="M120 180 C90 220 90 290 120 330 C130 310 130 250 120 180 Z" />
    <path d="M135 150 C110 180 110 220 135 240 C145 220 145 180 135 150 Z" />
    <path d="M140 330 C115 350 120 380 150 390 C155 365 150 345 140 330 Z" />
    <!-- Right Wreath Leaf Clusters -->
    <path d="M392 180 C422 220 422 290 392 330 C382 310 382 250 392 180 Z" />
    <path d="M377 150 C402 180 402 220 377 240 C367 220 367 180 377 150 Z" />
    <path d="M372 330 C397 350 392 380 362 390 C357 365 362 345 372 330 Z" />
  </g>

  <!-- Roman Colosseum Arches Base (Silhouetted Foundation) -->
  <g fill="#44403c" opacity="0.6">
    <path d="M160 360 L352 360 L340 390 L172 390 Z" />
    <rect x="180" y="365" width="22" height="20" rx="8" fill="#1c1917" />
    <rect x="216" y="365" width="22" height="20" rx="8" fill="#1c1917" />
    <rect x="252" y="365" width="22" height="20" rx="8" fill="#1c1917" />
    <rect x="288" y="365" width="22" height="20" rx="8" fill="#1c1917" />
    <rect x="320" y="365" width="16" height="20" rx="8" fill="#1c1917" />
  </g>

  <!-- Golden Spaghetti Swirl / Perfect Cream Emulsion -->
  <g filter="url(#glow)">
    <path d="M170 280 C180 230 240 220 270 245 C300 270 345 260 340 215 C335 170 280 160 256 185 C230 210 200 215 190 240 C180 265 190 310 230 325 C270 340 320 330 335 295 C350 260 320 230 300 235" 
          fill="none" stroke="url(#goldGrad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M195 270 C210 250 245 245 265 260 C285 275 315 270 315 240" 
          fill="none" stroke="#fef08a" stroke-width="10" stroke-linecap="round" />
  </g>

  <!-- Traditional Roman Cooking Pan (Ferro/Alluminio) & Crispy Guanciale Cubes -->
  <g fill="url(#terracottaGrad)">
    <rect x="220" y="270" width="24" height="20" rx="5" transform="rotate(12 220 270)" />
    <rect x="275" y="240" width="26" height="22" rx="5" transform="rotate(-18 275 240)" />
    <rect x="245" y="300" width="22" height="18" rx="4" transform="rotate(5 245 300)" />
    <!-- Guanciale crispy browned edges -->
    <rect x="222" y="272" width="20" height="6" rx="2" fill="#7f1d1d" transform="rotate(12 220 270)" />
    <rect x="277" y="242" width="22" height="7" rx="2" fill="#7f1d1d" transform="rotate(-18 275 240)" />
  </g>

  <!-- Freshly Cracked Tellicherry Black Pepper Specs -->
  <g fill="#0a0a0a">
    <circle cx="215" cy="235" r="4.5" />
    <circle cx="280" cy="285" r="5" />
    <circle cx="260" cy="225" r="3.5" />
    <circle cx="310" cy="265" r="4" />
    <circle cx="235" cy="325" r="4" />
    <circle cx="305" cy="315" r="4.5" />
    <circle cx="185" cy="255" r="3.5" />
  </g>

  <!-- Golden Fork Lifting Pasta Swirl -->
  <g fill="url(#goldGrad)">
    <!-- Fork Handle -->
    <path d="M250 80 L262 80 L260 170 L252 170 Z" />
    <!-- Fork Base & Tines -->
    <path d="M242 165 C242 185 270 185 270 165 L272 135 L268 135 L266 160 C266 172 258 172 258 160 L260 135 L254 135 L252 160 C252 172 244 172 244 160 L242 135 L238 135 Z" />
  </g>

  <!-- Crown / Scientific Emblem at Top -->
  <path d="M236 65 L256 45 L276 65 L268 75 L244 75 Z" fill="url(#goldGrad)" />
</svg>
